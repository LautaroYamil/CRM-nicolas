<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>El Gallego CRM - Iniciar Sesión</title>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#000000",
                    "surface-variant": "#e4e2e2",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#e5e2e1",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "on-background": "#1b1c1c",
                    "on-tertiary-container": "#838484",
                    "on-secondary-fixed": "#1c1b1b",
                    "surface-dim": "#dbdad9",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f5f3f3",
                    "on-secondary-fixed-variant": "#474746",
                    "inverse-primary": "#c6c6c6",
                    "on-tertiary": "#ffffff",
                    "primary": "#000000",
                    "surface-container-high": "#e9e8e7",
                    "surface-bright": "#fbf9f8",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#1b1b1b",
                    "secondary": "#5f5e5e",
                    "background": "#fbf9f8",
                    "secondary-container": "#e2dfde",
                    "on-tertiary-fixed": "#1a1c1c",
                    "surface-container-highest": "#e4e2e2",
                    "outline": "#7e7576",
                    "on-surface": "#1b1c1c",
                    "on-primary-fixed-variant": "#474747",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#636262",
                    "secondary-fixed-dim": "#c8c6c5",
                    "primary-fixed": "#e2e2e2",
                    "surface-tint": "#5e5e5e",
                    "outline-variant": "#cfc4c5",
                    "inverse-on-surface": "#f2f0f0",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-container": "#848484",
                    "primary-fixed-dim": "#c6c6c6",
                    "tertiary-fixed": "#e2e2e2",
                    "on-tertiary-fixed-variant": "#454747",
                    "on-surface-variant": "#4c4546",
                    "surface-container": "#efeded",
                    "on-secondary": "#ffffff",
                    "primary-container": "#1b1b1b",
                    "surface": "#fbf9f8",
                    "inverse-surface": "#303031",
                    "tertiary-container": "#1a1c1c",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "lg": "24px",
                    "md": "16px",
                    "xs": "4px",
                    "sm": "8px",
                    "gutter": "16px",
                    "base": "4px",
                    "margin-mobile": "20px"
            },
            "fontFamily": {
                    "headline-md": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "label-lg": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "button": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "button": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .focused-input {
            border-color: #000000 !important;
            box-shadow: inset 0 0 0 1px #000000;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Login Shell Suppression: Per mandates, Shell (Nav/TopBar) is hidden for Transactional pages -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant p-lg space-y-xl shadow-sm">
<!-- Brand Identity Section -->
<header class="flex flex-col items-center text-center space-y-md pt-md">
<div class="w-16 h-16 bg-tertiary text-on-primary rounded-xl flex items-center justify-center mb-sm shadow-md transition-transform hover:scale-105 active:scale-95 duration-200">
<span class="material-symbols-outlined text-4xl" data-icon="chair">chair</span>
</div>
<div class="space-y-base">
<h1 class="font-headline-lg text-headline-lg-mobile text-primary tracking-tight">El Gallego</h1>
<p class="font-label-lg text-label-lg uppercase tracking-widest text-secondary">CRM COMERCIAL</p>
</div>
</header>
<!-- Form Content -->
<section class="space-y-lg">
<div class="space-y-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-secondary">Ingresa tus credenciales para acceder a tu cuenta.</p>
</div>
<form action="#" class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="email">Correo electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-md pl-12 pr-md font-body-md text-body-md focus:outline-none focus:ring-0 focus:border-primary transition-all" id="email" name="email" placeholder="nombre@correo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="password">Contraseña</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-md pl-12 pr-md font-body-md text-body-md focus:outline-none focus:ring-0 focus:border-primary transition-all" id="password" name="password" placeholder="Tu contraseña" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-md flex items-center cursor-pointer text-secondary hover:text-primary transition-colors" onclick="togglePassword()">
<span class="material-symbols-outlined" data-icon="visibility" id="pass-toggle-icon">visibility</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-tertiary text-on-primary font-button text-button py-md px-lg rounded-lg flex justify-center items-center gap-sm uppercase tracking-wider transition-all duration-200 active:scale-95 active:opacity-90 mt-xl shadow-lg hover:shadow-xl" type="submit">
                    INICIAR SESIÓN
                    <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</section>
<!-- Footer / Redirect -->
<footer class="pt-lg border-t border-surface-container text-center">
<p class="font-body-md text-body-md text-secondary">
                No tenes cuenta? 
                <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4" href="#">Pedile acceso al administrador.</a>
</p>
</footer>
</main>
<!-- Visual Backdrop Decor (Subtle Atmosphere) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden opacity-50">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-surface-container-high rounded-full blur-[100px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[50%] h-[50%] bg-secondary-container rounded-full blur-[120px]"></div>
</div>
<script>
        // Micro-interaction: Toggle Password Visibility
        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('pass-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add subtle focus animation logic for form groups
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
